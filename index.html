<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ============================================ -->
  <!-- TÍTULO Y DESCRIPCIÓN PRINCIPAL               -->
  <!-- ============================================ -->
  <title>Edificio Altamira · Portal Vecinos</title>
  <meta name="description"
    content="Plataforma informativa exclusiva de la comunidad del Edificio Altamira. Elecciones de administración, noticias, documentos y contacto oficial." />
  <meta name="author" content="Comunidad Edificio Altamira" />
  <meta name="theme-color" content="#2563eb" />

  <!-- ============================================ -->
  <!-- FAVICON (pestaña del navegador)              -->
  <!-- ============================================ -->
  <link rel="icon" type="image/jpeg" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/favicon.ico" />

  <!-- ============================================ -->
  <!-- OPEN GRAPH (WhatsApp, Facebook, LinkedIn)    -->
  <!-- ⚠️ REEMPLAZA "TU-DOMINIO" por tu dominio real -->
  <!-- ============================================ -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Edificio Altamira" />
  <meta property="og:title" content="Edificio Altamira · Portal Vecinos" />
  <meta property="og:description"
    content="Plataforma informativa exclusiva de la comunidad. Elecciones, noticias, documentos y contacto oficial." />
  <meta property="og:url" content="https://https://altamira-platform.vercel.app/" />
  <meta property="og:locale" content="es_CL" />

  <!-- Imagen para preview (WhatsApp requiere URL absoluta HTTPS) -->
  <meta property="og:image" content="https://https://altamira-platform.vercel.app/og-image.jpeg" />
  <meta property="og:image:secure_url" content="https://https://altamira-platform.vercel.app/og-image.jpeg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Edificio Altamira - Portal Vecinos" />

  <!-- ============================================ -->
  <!-- TWITTER / X CARD                             -->
  <!-- ============================================ -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Edificio Altamira · Portal Vecinos" />
  <meta name="twitter:description"
    content="Plataforma informativa exclusiva de la comunidad. Elecciones, noticias, documentos y contacto oficial." />
  <meta name="twitter:image" content="https://https://altamira-platform.vercel.app/og-image.jpeg" />

  <!-- ============================================ -->
  <!-- PWA - PROGRESSIVE WEB APP                    -->
  <!-- ============================================ -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#2563eb" />

  <!-- iOS (Safari no lee manifest completo) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Altamira" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Windows / Edge -->
  <meta name="msapplication-TileColor" content="#2563eb" />
  <meta name="msapplication-TileImage" content="/icon-192.png" />

  <!-- ============================================ -->
  <!-- ROBOTS (portal privado, no indexar en Google) -->
  <!-- ============================================ -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- ============================================ -->
  <!-- FUENTES                                     -->
  <!-- ============================================ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
